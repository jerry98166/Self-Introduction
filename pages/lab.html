<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能實驗室 | Feature Lab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 1rem;
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            margin-top: 4rem;
            animation: fadeInDown 1s ease;
        }
        
        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 0.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            word-break: break-word;
        }
        
        .header p {
            font-size: clamp(1rem, 3vw, 1.3rem);
            opacity: 0.95;
            font-weight: 300;
            word-wrap: break-word;
        }
        
        .back-btn {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            font-size: 0.95rem;
        }
        
        .back-btn:hover {
            background: white;
            color: #667eea;
            transform: translateX(-5px);
        }
        
        /* 功能導航器樣式 */
        .feature-navigator-panel {
            animation: fadeInUp 0.8s ease;
        }
        
        .nav-search-bar {
            margin-bottom: 2rem;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .search-input:focus {
            outline: none;
            border-color: white;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        .clear-search-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .clear-search-btn:hover {
            color: white;
        }
        
        .nav-filters {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .filter-section h5 {
            margin-bottom: 1rem;
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        
        .filter-btn {
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        .filter-btn .count {
            opacity: 0.8;
            margin-left: 0.4rem;
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
            transform: translateY(-2px);
        }
        
        .featured-section,
        .features-section {
            margin-bottom: 2.5rem;
        }
        
        .featured-section h3,
        .features-section h3 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .featured-grid,
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .feature-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }
        
        .feature-card.featured {
            border: 2px solid rgba(255, 215, 0, 0.5);
            background: rgba(255, 215, 0, 0.1);
        }
        
        .feature-card.featured:hover {
            border-color: rgba(255, 215, 0, 0.8);
            background: rgba(255, 215, 0, 0.15);
        }
        
        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }
        
        .feature-card h3,
        .feature-card h4 {
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            word-break: break-word;
        }
        
        .feature-card .description {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-bottom: 1rem;
            flex-grow: 1;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .feature-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .feature-meta .category,
        .feature-meta .tag {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .feature-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            display: block;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .load-more {
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .load-more-btn {
            padding: 0.8rem 2rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .load-more-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }
            
            .header {
                margin-top: 5rem;
                margin-bottom: 1.5rem;
            }
            
            .header h1 {
                margin-bottom: 0.5rem;
            }
            
            .back-btn {
                top: 1rem;
                left: 1rem;
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }
            
            .nav-filters {
                padding: 1rem;
            }
            
            .filter-buttons {
                gap: 0.6rem;
            }
            
            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
            
            .featured-grid,
            .features-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }
            
            .feature-card {
                padding: 1.2rem;
            }
            
            .feature-icon {
                font-size: 2rem;
            }
            
            .feature-stats {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 0.8rem;
            }
            
            .stat {
                padding: 1rem;
            }
            
            .stat-number {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 0.5rem;
            }
            
            .back-btn {
                position: static;
                width: 100%;
                justify-content: center;
                margin-bottom: 1rem;
            }
            
            .header {
                margin-top: 1rem;
            }
            
            .featured-grid,
            .features-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-buttons {
                gap: 0.5rem;
            }
            
            .filter-btn {
                flex: 1;
                min-width: 0;
                padding: 0.5rem 0.8rem;
            }
            
            .feature-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> 返回主頁
    </a>
    
    <div class="container">
        <div class="header">
            <h1>🚀 功能實驗室</h1>
            <p>探索 60+ 項高級互動功能和創新體驗</p>
        </div>
        
        <!-- 智能導航面板（自動生成） -->
        <div id="navigator-container"></div>
    </div>
    
    <!-- 功能導航 JavaScript 模組 -->
    <script src="../assets/js/feature-navigator.js"></script>
    
    <!-- 初始化導航器 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 動態插入生成的導航 HTML
            const manifest = window.FeatureNavigator.getManifest();
            const container = document.getElementById('navigator-container');
            
            // 生成導航 HTML
            const html = generateNavigatorHTML(manifest);
            container.innerHTML = html;
            
            // 重新初始化導航器（綁定事件監聽器）
            window.FeatureNavigator.initNavigator();
        });
        
        /**
         * 生成導航 HTML - 與 nav-generator.js 同步
         */
        function generateNavigatorHTML(manifest) {
            const categories = Object.entries(manifest.categories)
                .map(([name, meta]) => ({
                    name,
                    emoji: meta.emoji,
                    count: meta.count || manifest.features.filter(f => f.category === name).length
                }))
                .sort((a, b) => b.count - a.count);
            
            const featured = manifest.features.filter(f => f.featured);
            const allFeatures = manifest.features;
            
            // 分類按鈕
            const categoryButtons = categories
                .map(cat => 
                    '<button class="filter-btn" data-category="' + cat.name.toLowerCase().replace(/\\s+/g, '-') + '">' +
                    cat.emoji + ' ' + cat.name + ' <span class="count">' + cat.count + '</span>' +
                    '</button>'
                )
                .join('');
            
            // 特色推薦卡片
            const featuredCards = featured
                .map((f) =>
                    '<div class="feature-card featured" data-id="' + f.id + '" onclick="navigateTo(\'' + f.id + '\')" role="button" tabindex="0">' +
                    '<div class="feature-icon">' + f.emoji + '</div>' +
                    '<h3>' + f.name + '</h3>' +
                    '<p class="description">' + f.description + '</p>' +
                    '<div class="feature-meta">' +
                    '<span class="category">' + f.category + '</span>' +
                    '</div>' +
                    '</div>'
                )
                .join('');
            
            // 完整特性網格
            const featureGrid = allFeatures
                .map(f =>
                    '<div class="feature-card" data-id="' + f.id + '" data-category="' + f.category.toLowerCase().replace(/\\s+/g, '-') + '" ' +
                    'data-tags="' + f.tags.join(' ') + '" onclick="navigateTo(\'' + f.id + '\')" role="button" tabindex="0">' +
                    '<div class="feature-icon">' + f.emoji + '</div>' +
                    '<h4>' + f.name + '</h4>' +
                    '<p class="description">' + f.description + '</p>' +
                    '<div class="feature-meta">' +
                    '<span class="category">' + f.category + '</span>' +
                    f.tags.map(t => '<span class="tag">' + t + '</span>').join('') +
                    '</div>' +
                    '</div>'
                )
                .join('');
            
            return '<div id="feature-navigator" class="feature-navigator-panel">' +
                '<div class="nav-search-bar">' +
                '<input type="text" id="feature-search" class="search-input" ' +
                'placeholder="🔍 搜尋功能名稱、標籤或說明..." ' +
                'onkeyup="searchFeatures(this.value)">' +
                '<button class="clear-search-btn" id="clear-search-btn" onclick="clearSearch()" style="display:none;">✕</button>' +
                '</div>' +
                '<div class="nav-filters">' +
                '<div class="filter-section">' +
                '<h5>📂 依分類篩選</h5>' +
                '<div class="filter-buttons">' +
                '<button class="filter-btn active" data-category="all">全部</button>' +
                categoryButtons +
                '</div>' +
                '</div>' +
                '</div>' +
                '<div class="featured-section">' +
                '<h3>⭐ 精選推薦</h3>' +
                '<div class="featured-grid">' +
                featuredCards +
                '</div>' +
                '</div>' +
                '<div class="features-section">' +
                '<h3>📚 完整功能列表</h3>' +
                '<div class="features-grid" id="features-grid">' +
                featureGrid +
                '</div>' +
                '</div>' +
                '<div class="load-more">' +
                '<button id="load-more-btn" class="load-more-btn" onclick="loadMoreFeatures()" style="display:none;">' +
                '載入更多功能 ↓' +
                '</button>' +
                '</div>' +
                '</div>' +
                '<div class="feature-stats">' +
                '<div class="stat">' +
                '<span class="stat-number">' + allFeatures.length + '</span>' +
                '<span class="stat-label">總功能數</span>' +
                '</div>' +
                '<div class="stat">' +
                '<span class="stat-number">' + Object.keys(manifest.categories).length + '</span>' +
                '<span class="stat-label">分類</span>' +
                '</div>' +
                '<div class="stat">' +
                '<span class="stat-number">' + featured.length + '</span>' +
                '<span class="stat-label">精選推薦</span>' +
                '</div>' +
                '</div>';
        }
    </script>
    
    <script defer src="../assets/js/lab.js"></script>
    <script defer src="../assets/js/subpage-ux.js"></script>
    <script defer src="../assets/js/security-hardening.js"></script>
</body>
</html>
