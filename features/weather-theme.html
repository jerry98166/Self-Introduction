        .weather-card {
            background: rgba(255,255,255,0.2);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }
        .weather-icon { font-size: 5em; margin-bottom: 20px; }
        .temperature { font-size: 3em; font-weight: bold; margin: 20px 0; }
        .location { font-size: 1.5em; opacity: 0.9; margin-bottom: 10px; }
        .description { font-size: 1.2em; opacity: 0.8; }
        .theme-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .theme-btn {
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
            color: white;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-5px); }
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            border: 2px solid white;
            margin-top: 20px;
        }
    </style>
</head>
<body class="sunny">
    <div class="container">
        <h1>🌤️ 動態天氣主題</h1>
        <div class="weather-card">
            <div class="weather-icon" id="weatherIcon">☀️</div>
            <div class="location" id="location">台北, 台灣</div>
            <div class="temperature" id="temperature">28°C</div>
            <div class="description" id="description">晴朗</div>
        </div>
        <h3 style="margin-bottom: 15px;">選擇天氣主題：</h3>
        <div class="theme-selector">
            <button class="theme-btn" onclick="setWeather('sunny')">☀️ 晴天</button>
            <button class="theme-btn" onclick="setWeather('rainy')">🌧️ 雨天</button>
            <button class="theme-btn" onclick="setWeather('cloudy')">☁️ 多雲</button>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <a href="../lab.html" class="back-btn">← 返回功能實驗室</a>
        </div>
    </div>
    <script>
        const weatherData = {
            sunny: { icon: '☀️', temp: '28°C', desc: '晴朗' },
            rainy: { icon: '🌧️', temp: '18°C', desc: '下雨' },
            cloudy: { icon: '☁️', temp: '22°C', desc: '多雲' }
        };
        
        function setWeather(type) {
            document.body.className = type;
            const data = weatherData[type];
            document.getElementById('weatherIcon').textContent = data.icon;
            document.getElementById('temperature').textContent = data.temp;
            document.getElementById('description').textContent = data.desc;
        }
        
        // 自動偵測真實天氣（簡化版）
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('location').textContent = '已定位';
            });
        }
    </script>
</body>
</html>
