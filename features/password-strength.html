<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 密碼強度測試器 - Password Strength Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .password-input-wrapper {
            position: relative;
        }

        #passwordInput {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        #passwordInput::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .toggle-visibility {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.2em;
        }

        .strength-meter {
            height: 30px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .strength-bar.weak {
            width: 25%;
            background: #ff4444;
        }

        .strength-bar.fair {
            width: 50%;
            background: #ffa500;
        }

        .strength-bar.good {
            width: 75%;
            background: #ffeb3b;
            color: #333;
        }

        .strength-bar.strong {
            width: 100%;
            background: #4caf50;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .analysis-item {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .analysis-item.met {
            background: rgba(76,175,80,0.3);
            border: 2px solid #4caf50;
        }

        .analysis-item.not-met {
            background: rgba(255,68,68,0.3);
            border: 2px solid #ff4444;
        }

        .icon {
            font-size: 1.5em;
        }

        .details-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .details-section h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .crack-time {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .crack-time.strong {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        }

        .crack-time h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .crack-time .time {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .suggestions {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
        }

        .suggestions h3 {
            margin-bottom: 15px;
        }

        .suggestion-list {
            list-style: none;
        }

        .suggestion-list li {
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding-left: 40px;
            position: relative;
        }

        .suggestion-list li:before {
            content: "💡";
            position: absolute;
            left: 10px;
            top: 10px;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
            border: 2px solid white;
        }

        .back-btn:hover {
            background: white;
            color: #667eea;
            transform: scale(1.05);
        }

        .entropy-bar {
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .entropy-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ffa500, #ffeb3b, #4caf50);
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 密碼強度測試器</h1>
            <p class="subtitle">分析密碼強度並估算破解時間</p>
        </header>

        <div class="main-panel">
            <div class="input-group">
                <label for="passwordInput">輸入密碼進行測試：</label>
                <div class="password-input-wrapper">
                    <input type="password" id="passwordInput" placeholder="請輸入密碼...">
                    <button class="toggle-visibility" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>

            <div id="resultsSection" style="display: none;">
                <div class="crack-time" id="crackTime">
                    <h3>預估破解時間</h3>
                    <div class="time" id="crackTimeValue">-</div>
                    <p id="crackTimeDesc"></p>
                </div>

                <div class="analysis-grid" id="criteriaGrid">
                    <div class="analysis-item" id="lengthCheck">
                        <span class="icon">📏</span>
                        <div>
                            <div><strong>長度檢查</strong></div>
                            <div id="lengthText">至少 8 個字符</div>
                        </div>
                    </div>
                    <div class="analysis-item" id="uppercaseCheck">
                        <span class="icon">🔠</span>
                        <div>
                            <div><strong>大寫字母</strong></div>
                            <div>A-Z</div>
                        </div>
                    </div>
                    <div class="analysis-item" id="lowercaseCheck">
                        <span class="icon">🔡</span>
                        <div>
                            <div><strong>小寫字母</strong></div>
                            <div>a-z</div>
                        </div>
                    </div>
                    <div class="analysis-item" id="numberCheck">
                        <span class="icon">🔢</span>
                        <div>
                            <div><strong>數字</strong></div>
                            <div>0-9</div>
                        </div>
                    </div>
                    <div class="analysis-item" id="specialCheck">
                        <span class="icon">✨</span>
                        <div>
                            <div><strong>特殊字符</strong></div>
                            <div>!@#$%^&*</div>
                        </div>
                    </div>
                    <div class="analysis-item" id="entropyCheck">
                        <span class="icon">🎲</span>
                        <div>
                            <div><strong>熵值</strong></div>
                            <div id="entropyValue">0 bits</div>
                        </div>
                    </div>
                </div>

                <div class="details-section">
                    <h3>📊 詳細統計</h3>
                    <div class="stat-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="totalLength">0</div>
                            <div class="stat-label">總長度</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="uniqueChars">0</div>
                            <div class="stat-label">唯一字符</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="charsetSize">0</div>
                            <div class="stat-label">字符集大小</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="combinations">0</div>
                            <div class="stat-label">可能組合</div>
                        </div>
                    </div>
                    <div class="entropy-bar">
                        <div class="entropy-fill" id="entropyBar"></div>
                    </div>
                </div>

                <div class="suggestions" id="suggestionsSection">
                    <h3>💡 改善建議</h3>
                    <ul class="suggestion-list" id="suggestionList"></ul>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="../pages/lab.html" class="back-btn">← 返回功能實驗室</a>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('passwordInput');
        let isVisible = false;

        function togglePassword() {
            isVisible = !isVisible;
            passwordInput.type = isVisible ? 'text' : 'password';
        }

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            
            if (password.length === 0) {
                document.getElementById('resultsSection').style.display = 'none';
                document.getElementById('strengthBar').className = 'strength-bar';
                document.getElementById('strengthBar').textContent = '';
                return;
            }

            document.getElementById('resultsSection').style.display = 'block';
            analyzePassword(password);
        });

        function analyzePassword(password) {
            const length = password.length;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

            // 更新檢查項目
            updateCheck('lengthCheck', length >= 8);
            updateCheck('uppercaseCheck', hasUppercase);
            updateCheck('lowercaseCheck', hasLowercase);
            updateCheck('numberCheck', hasNumber);
            updateCheck('specialCheck', hasSpecial);

            document.getElementById('lengthText').textContent = `${length} 個字符 (建議 ≥12)`;

            // 計算強度分數
            let score = 0;
            if (length >= 8) score += 20;
            if (length >= 12) score += 10;
            if (length >= 16) score += 10;
            if (hasUppercase) score += 15;
            if (hasLowercase) score += 15;
            if (hasNumber) score += 15;
            if (hasSpecial) score += 15;

            // 計算熵值
            let charsetSize = 0;
            if (hasLowercase) charsetSize += 26;
            if (hasUppercase) charsetSize += 26;
            if (hasNumber) charsetSize += 10;
            if (hasSpecial) charsetSize += 32;

            const entropy = length * Math.log2(charsetSize);
            const entropyPercent = Math.min((entropy / 100) * 100, 100);

            document.getElementById('entropyValue').textContent = `${entropy.toFixed(1)} bits`;
            document.getElementById('entropyBar').style.width = entropyPercent + '%';
            updateCheck('entropyCheck', entropy >= 60);

            // 計算可能組合數
            const combinations = Math.pow(charsetSize, length);
            const combinationsStr = combinations > 1e15 ? combinations.toExponential(2) : combinations.toLocaleString();

            // 更新統計
            document.getElementById('totalLength').textContent = length;
            document.getElementById('uniqueChars').textContent = new Set(password).size;
            document.getElementById('charsetSize').textContent = charsetSize;
            document.getElementById('combinations').textContent = combinationsStr;

            // 計算破解時間（假設每秒 10 億次嘗試）
            const attemptsPerSecond = 1e9;
            const secondsToCrack = combinations / (2 * attemptsPerSecond);
            const crackTimeText = formatTime(secondsToCrack);

            const crackTimeDiv = document.getElementById('crackTime');
            document.getElementById('crackTimeValue').textContent = crackTimeText.value;
            document.getElementById('crackTimeDesc').textContent = crackTimeText.description;

            // 更新強度條
            const strengthBar = document.getElementById('strengthBar');
            let strengthClass = 'weak';
            let strengthText = '弱';

            if (score >= 90) {
                strengthClass = 'strong';
                strengthText = '強';
                crackTimeDiv.className = 'crack-time strong pulse';
            } else if (score >= 70) {
                strengthClass = 'good';
                strengthText = '好';
                crackTimeDiv.className = 'crack-time';
            } else if (score >= 50) {
                strengthClass = 'fair';
                strengthText = '普通';
                crackTimeDiv.className = 'crack-time';
            } else {
                crackTimeDiv.className = 'crack-time';
            }

            strengthBar.className = `strength-bar ${strengthClass}`;
            strengthBar.textContent = strengthText;

            // 生成建議
            generateSuggestions(password, {length, hasUppercase, hasLowercase, hasNumber, hasSpecial, entropy});
        }

        function updateCheck(elementId, isMet) {
            const element = document.getElementById(elementId);
            if (isMet) {
                element.classList.remove('not-met');
                element.classList.add('met');
            } else {
                element.classList.remove('met');
                element.classList.add('not-met');
            }
        }

        function formatTime(seconds) {
            if (seconds < 1) {
                return {value: '< 1 秒', description: '⚠️ 極易破解'};
            } else if (seconds < 60) {
                return {value: `${Math.ceil(seconds)} 秒`, description: '⚠️ 非常不安全'};
            } else if (seconds < 3600) {
                return {value: `${Math.ceil(seconds / 60)} 分鐘`, description: '⚠️ 不安全'};
            } else if (seconds < 86400) {
                return {value: `${Math.ceil(seconds / 3600)} 小時`, description: '⚠️ 有風險'};
            } else if (seconds < 2592000) {
                return {value: `${Math.ceil(seconds / 86400)} 天`, description: '⚠️ 建議加強'};
            } else if (seconds < 31536000) {
                return {value: `${Math.ceil(seconds / 2592000)} 個月`, description: '✅ 相對安全'};
            } else if (seconds < 3153600000) {
                return {value: `${Math.ceil(seconds / 31536000)} 年`, description: '✅ 安全'};
            } else if (seconds < 31536000000) {
                return {value: `${(seconds / 31536000).toExponential(2)} 年`, description: '✅ 非常安全'};
            } else {
                return {value: '數十億年', description: '✅ 幾乎無法破解'};
            }
        }

        function generateSuggestions(password, criteria) {
            const suggestions = [];

            if (criteria.length < 12) {
                suggestions.push('增加密碼長度到至少 12 個字符');
            }
            if (!criteria.hasUppercase) {
                suggestions.push('加入大寫字母 (A-Z)');
            }
            if (!criteria.hasLowercase) {
                suggestions.push('加入小寫字母 (a-z)');
            }
            if (!criteria.hasNumber) {
                suggestions.push('加入數字 (0-9)');
            }
            if (!criteria.hasSpecial) {
                suggestions.push('加入特殊字符 (!@#$%^&*)');
            }
            if (criteria.entropy < 60) {
                suggestions.push('增加字符多樣性以提高熵值');
            }

            // 檢查常見模式
            if (/(.)\1{2,}/.test(password)) {
                suggestions.push('避免重複連續字符（如 aaa, 111）');
            }
            if (/^[0-9]+$/.test(password)) {
                suggestions.push('不要只使用數字');
            }
            if (/^[a-zA-Z]+$/.test(password)) {
                suggestions.push('不要只使用字母');
            }
            if (/123|abc|qwerty|password/i.test(password)) {
                suggestions.push('避免使用常見順序或單詞');
            }

            if (suggestions.length === 0) {
                suggestions.push('✅ 密碼強度很好！記得定期更換密碼');
                suggestions.push('✅ 不要在多個網站使用相同密碼');
                suggestions.push('✅ 考慮使用密碼管理器');
            }

            const suggestionList = document.getElementById('suggestionList');
            suggestionList.innerHTML = suggestions.map(s => `<li>${s}</li>`).join('');
        }
    </script>
</body>
</html>
