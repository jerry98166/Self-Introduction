<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 3D 貢獻圖 - 3D Contribution Graph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        #canvas-container {
            width: 100%;
            height: 600px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .controls-panel h2 {
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .control-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .control-group:last-child {
            border-bottom: none;
        }

        .control-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            border: none;
        }

        .value-display {
            min-width: 45px;
            text-align: right;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .view-preset {
            background: rgba(255,255,255,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.9em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .info-panel {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            font-size: 0.9em;
        }

        .tooltip.show {
            opacity: 1;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            #canvas-container {
                height: 400px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 3D 貢獻圖表</h1>
            <p class="subtitle">互動式 3D 視覺化展示您的編程活動</p>
        </header>

        <div class="main-content">
            <!-- 3D Canvas -->
            <div class="panel">
                <div id="canvas-container"></div>
                <div class="legend">
                    <span>貢獻強度：</span>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #0e4429;"></div>
                        <span>低</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #006d32;"></div>
                        <span>中</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #26a641;"></div>
                        <span>高</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #39d353;"></div>
                        <span>極高</span>
                    </div>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="controls-panel">
                <div class="panel">
                    <h2>🎮 控制面板</h2>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value" id="totalCommits">0</div>
                            <div class="stat-label">總提交數</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="avgCommits">0</div>
                            <div class="stat-label">平均/天</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="maxCommits">0</div>
                            <div class="stat-label">單日最高</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="activeStreak">0</div>
                            <div class="stat-label">連續天數</div>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">📐 柱狀高度縮放</label>
                        <div class="slider-container">
                            <input type="range" id="heightScale" min="0.5" max="3" step="0.1" value="1.5">
                            <span class="value-display" id="heightValue">1.5x</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">🔄 旋轉速度</label>
                        <div class="slider-container">
                            <input type="range" id="rotationSpeed" min="0" max="5" step="0.1" value="1">
                            <span class="value-display" id="rotationValue">1x</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">📅 顯示週數</label>
                        <div class="slider-container">
                            <input type="range" id="weeksDisplay" min="12" max="52" step="1" value="52">
                            <span class="value-display" id="weeksValue">52</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">🎨 視覺模式</label>
                        <div class="button-group">
                            <button class="view-preset" onclick="setViewPreset('default')">🏠 預設視角</button>
                            <button class="view-preset" onclick="setViewPreset('top')">⬆️ 俯視圖</button>
                            <button class="view-preset" onclick="setViewPreset('side')">➡️ 側視圖</button>
                            <button class="view-preset" onclick="setViewPreset('isometric')">📐 等角視圖</button>
                        </div>
                    </div>

                    <div class="button-group">
                        <button onclick="regenerateData()">🔄 重新生成數據</button>
                        <button onclick="exportImage()">📸 匯出圖片</button>
                        <button onclick="toggleAnimation()">⏯️ 暫停/播放</button>
                    </div>
                </div>

                <div class="panel info-panel">
                    <h3 style="margin-bottom: 15px;">ℹ️ 資訊</h3>
                    <div class="info-row">
                        <span>滑鼠滾輪</span>
                        <span>縮放</span>
                    </div>
                    <div class="info-row">
                        <span>滑鼠左鍵拖曳</span>
                        <span>旋轉視角</span>
                    </div>
                    <div class="info-row">
                        <span>滑鼠右鍵拖曳</span>
                        <span>平移視圖</span>
                    </div>
                    <div class="info-row">
                        <span>懸停柱狀</span>
                        <span>查看詳情</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js 場景設置
        let scene, camera, renderer, controls;
        let cubes = [];
        let contributionData = [];
        let isAnimating = true;
        let animationSpeed = 0.005;
        let heightScale = 1.5;
        let weeksToShow = 52;

        // 初始化
        function init() {
            const container = document.getElementById('canvas-container');

            // 創建場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);
            scene.fog = new THREE.Fog(0x0a0e27, 50, 200);

            // 創建相機
            camera = new THREE.PerspectiveCamera(
                60,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(40, 40, 40);
            camera.lookAt(0, 0, 0);

            // 創建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 添加燈光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 30, 20);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x667eea, 1, 100);
            pointLight.position.set(-20, 20, 20);
            scene.add(pointLight);

            // 添加網格地板
            const gridHelper = new THREE.GridHelper(100, 50, 0x667eea, 0x2a2a2a);
            gridHelper.position.y = -0.5;
            scene.add(gridHelper);

            // 生成貢獻數據
            generateContributionData();
            createContributionCubes();

            // 添加控制器
            setupControls();

            // 監聽視窗大小變化
            window.addEventListener('resize', onWindowResize);

            // 開始動畫循環
            animate();

            // 設置控制面板
            setupControlPanel();
        }

        // 生成貢獻數據
        function generateContributionData() {
            contributionData = [];
            const weeks = weeksToShow;
            const days = 7;

            for (let week = 0; week < weeks; week++) {
                for (let day = 0; day < days; day++) {
                    const commits = Math.random() < 0.3 ? 0 : Math.floor(Math.random() * 25);
                    contributionData.push({
                        week,
                        day,
                        commits,
                        date: getDateString(week, day)
                    });
                }
            }

            updateStats();
        }

        // 創建 3D 柱狀圖
        function createContributionCubes() {
            // 清除舊的立方體
            cubes.forEach(cube => scene.remove(cube));
            cubes = [];

            const cubeSize = 0.8;
            const spacing = 1.2;
            const weeks = Math.max(...contributionData.map(d => d.week)) + 1;

            contributionData.forEach(data => {
                const height = data.commits === 0 ? 0.1 : (data.commits / 25) * 10 * heightScale;
                
                const geometry = new THREE.BoxGeometry(cubeSize, height, cubeSize);
                const color = getColorForCommits(data.commits);
                const material = new THREE.MeshPhongMaterial({ 
                    color,
                    shininess: 100,
                    emissive: color,
                    emissiveIntensity: 0.2
                });

                const cube = new THREE.Mesh(geometry, material);
                const x = (data.week - weeks / 2) * spacing;
                const z = (data.day - 3.5) * spacing;
                
                cube.position.set(x, height / 2, z);
                cube.castShadow = true;
                cube.receiveShadow = true;

                // 存儲數據用於交互
                cube.userData = data;

                scene.add(cube);
                cubes.push(cube);
            });
        }

        // 根據提交數獲取顏色
        function getColorForCommits(commits) {
            if (commits === 0) return 0x161b22;
            if (commits < 5) return 0x0e4429;
            if (commits < 10) return 0x006d32;
            if (commits < 15) return 0x26a641;
            return 0x39d353;
        }

        // 獲取日期字串
        function getDateString(week, day) {
            const date = new Date();
            date.setDate(date.getDate() - ((weeksToShow - week) * 7 + (6 - day)));
            return date.toLocaleDateString('zh-TW');
        }

        // 設置簡單控制（滑鼠交互）
        function setupControls() {
            const container = document.getElementById('canvas-container');
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let rotationVelocity = { x: 0, y: 0 };

            container.addEventListener('mousedown', (e) => {
                isDragging = true;
            });

            container.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaMove = {
                        x: e.offsetX - previousMousePosition.x,
                        y: e.offsetY - previousMousePosition.y
                    };

                    rotationVelocity.x = deltaMove.y * 0.01;
                    rotationVelocity.y = deltaMove.x * 0.01;
                }

                previousMousePosition = {
                    x: e.offsetX,
                    y: e.offsetY
                };

                // 懸停檢測（簡化版）
                checkHover(e);
            });

            container.addEventListener('mouseup', () => {
                isDragging = false;
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.05;
                camera.position.z = Math.max(20, Math.min(100, camera.position.z));
            });

            // 應用旋轉慣性
            function applyRotation() {
                scene.rotation.x += rotationVelocity.x;
                scene.rotation.y += rotationVelocity.y;
                
                rotationVelocity.x *= 0.95;
                rotationVelocity.y *= 0.95;
            }

            renderer.domElement.addEventListener('mousemove', applyRotation);
        }

        // 檢查懸停
        function checkHover(event) {
            // 簡化的懸停檢測
            const tooltip = document.getElementById('tooltip');
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera({ x, y }, camera);

            const intersects = raycaster.intersectObjects(cubes);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                tooltip.innerHTML = `
                    <strong>${data.date}</strong><br>
                    提交次數: ${data.commits}
                `;
                tooltip.style.left = event.clientX + 10 + 'px';
                tooltip.style.top = event.clientY + 10 + 'px';
                tooltip.classList.add('show');
            } else {
                tooltip.classList.remove('show');
            }
        }

        // 動畫循環
        function animate() {
            requestAnimationFrame(animate);

            if (isAnimating) {
                scene.rotation.y += animationSpeed;
            }

            renderer.render(scene, camera);
        }

        // 視窗大小調整
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // 更新統計數據
        function updateStats() {
            const total = contributionData.reduce((sum, d) => sum + d.commits, 0);
            const avg = Math.round(total / contributionData.length * 10) / 10;
            const max = Math.max(...contributionData.map(d => d.commits));
            
            // 計算連續天數
            let currentStreak = 0;
            let maxStreak = 0;
            let tempStreak = 0;
            
            contributionData.forEach(d => {
                if (d.commits > 0) {
                    tempStreak++;
                    maxStreak = Math.max(maxStreak, tempStreak);
                } else {
                    tempStreak = 0;
                }
            });

            document.getElementById('totalCommits').textContent = total;
            document.getElementById('avgCommits').textContent = avg;
            document.getElementById('maxCommits').textContent = max;
            document.getElementById('activeStreak').textContent = maxStreak;
        }

        // 設置控制面板
        function setupControlPanel() {
            document.getElementById('heightScale').addEventListener('input', (e) => {
                heightScale = parseFloat(e.target.value);
                document.getElementById('heightValue').textContent = heightScale.toFixed(1) + 'x';
                createContributionCubes();
            });

            document.getElementById('rotationSpeed').addEventListener('input', (e) => {
                animationSpeed = parseFloat(e.target.value) * 0.005;
                document.getElementById('rotationValue').textContent = e.target.value + 'x';
            });

            document.getElementById('weeksDisplay').addEventListener('input', (e) => {
                weeksToShow = parseInt(e.target.value);
                document.getElementById('weeksValue').textContent = e.target.value;
                regenerateData();
            });
        }

        // 設置視角預設
        function setViewPreset(preset) {
            switch(preset) {
                case 'default':
                    camera.position.set(40, 40, 40);
                    break;
                case 'top':
                    camera.position.set(0, 80, 0);
                    break;
                case 'side':
                    camera.position.set(60, 20, 0);
                    break;
                case 'isometric':
                    camera.position.set(45, 45, 45);
                    break;
            }
            camera.lookAt(0, 0, 0);
        }

        // 重新生成數據
        function regenerateData() {
            generateContributionData();
            createContributionCubes();
        }

        // 切換動畫
        function toggleAnimation() {
            isAnimating = !isAnimating;
        }

        // 匯出圖片
        function exportImage() {
            renderer.render(scene, camera);
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = '3d-contribution-graph.png';
            link.href = dataURL;
            link.click();
        }

        // 啟動
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <script defer src="../assets/js/security-hardening.js"></script>
</body>
</html>
