<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 程式碼解謎遊戲 - Code Puzzle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .panel h2 {
            margin-bottom: 20px;
            font-size: 1.4em;
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .level-btn {
            padding: 15px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-align: center;
        }

        .level-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .level-btn.active {
            background: #3498db;
            border-color: #3498db;
        }

        .level-btn.completed {
            background: #27ae60;
            border-color: #27ae60;
        }

        .level-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .code-editor {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #d4d4d4;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            position: relative;
        }

        .code-line {
            display: flex;
            padding: 5px 0;
            line-height: 1.6;
        }

        .line-number {
            color: #858585;
            margin-right: 20px;
            user-select: none;
            min-width: 30px;
            text-align: right;
        }

        .line-content {
            flex: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .bug {
            background: rgba(231,76,60,0.2);
            border-left: 3px solid #e74c3c;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bug:hover {
            background: rgba(231,76,60,0.3);
        }

        .fixed {
            background: rgba(46,204,113,0.2);
            border-left: 3px solid #2ecc71;
        }

        .keyword { color: #569cd6; }
        .string { color: #ce9178; }
        .comment { color: #6a9955; font-style: italic; }
        .function { color: #dcdcaa; }
        .number { color: #b5cea8; }

        .challenge-info {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .challenge-info h3 {
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .challenge-info p {
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .hint-btn {
            padding: 12px 25px;
            background: #f39c12;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .hint-btn:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .check-btn {
            padding: 15px 30px;
            background: #27ae60;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
            width: 100%;
        }

        .check-btn:hover {
            background: #229954;
        }

        .hint-box {
            background: rgba(243,156,18,0.2);
            border-left: 4px solid #f39c12;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }

        .hint-box.show {
            display: block;
        }

        .success-message {
            background: rgba(46,204,113,0.2);
            border: 2px solid #2ecc71;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
            border: 2px solid white;
        }

        .back-btn:hover {
            background: white;
            color: #1e3c72;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧩 程式碼解謎遊戲</h1>
            <p class="subtitle">找出並修正程式碼中的 Bug</p>
        </header>

        <div class="game-grid">
            <div class="panel">
                <h2>📝 程式碼編輯器</h2>
                <div class="code-editor" id="codeEditor"></div>
            </div>

            <div class="panel">
                <h2>🎯 關卡選擇</h2>
                <div class="level-selector" id="levelSelector"></div>

                <div class="challenge-info" id="challengeInfo">
                    <h3 id="challengeTitle">選擇一個關卡開始</h3>
                    <p id="challengeDesc">點擊左側的關卡按鈕開始挑戰</p>
                    <div id="challengeHints"></div>
                </div>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="bugsFound">0</div>
                        <div class="stat-label">已找到</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalBugs">0</div>
                        <div class="stat-label">總數量</div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar">0%</div>
                </div>

                <button class="hint-btn" onclick="showHint()">💡 提示</button>
                <button class="check-btn" id="checkBtn" onclick="checkSolution()">✅ 檢查答案</button>

                <div class="hint-box" id="hintBox"></div>
                <div class="success-message" id="successMessage">
                    <h3>🎉 太厲害了！</h3>
                    <p>你找到了所有的 Bug！</p>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="../pages/lab.html" class="back-btn">← 返回功能實驗室</a>
        </div>
    </div>

    <script>
        const challenges = [
            {
                id: 1,
                title: "關卡 1: 基礎語法錯誤",
                description: "找出JavaScript基礎語法中的錯誤",
                code: `function calculateSum(a, b) {
    let result = a + b
    console.log("結果是:" result);
    return result;
}

const num1 = 10;
const num2 = 20;
calculateSum(num1, num2);`,
                bugs: [2, 3],
                hints: [
                    "檢查第3行的console.log語法",
                    "字串與變數之間需要連接符號",
                    "應該使用 + 或逗號分隔"
                ]
            },
            {
                id: 2,
                title: "關卡 2: 陣列操作錯誤",
                description: "修正陣列處理邏輯中的問題",
                code: `const numbers = [1, 2, 3, 4, 5];
let sum = 0;

for (let i = 0; i <= numbers.length; i++) {
    sum += numbers[i];
}

console.log("總和:", sum);`,
                bugs: [4],
                hints: [
                    "檢查迴圈的條件",
                    "陣列索引從0開始",
                    "應該使用 < 而不是 <="
                ]
            },
            {
                id: 3,
                title: "關卡 3: 物件屬性錯誤",
                description: "找出物件操作中的錯誤",
                code: `const user = {
    name: "張三",
    age: 25,
    email: "11028201@cycu.org.tw"
};

console.log(user.Name);
const userAge = user[age];
console.log("年齡:", userAge);`,
                bugs: [7, 8],
                hints: [
                    "JavaScript是大小寫敏感的",
                    "物件屬性名稱要用引號",
                    "檢查第7行和第8行"
                ]
            },
            {
                id: 4,
                title: "關卡 4: 函數回傳錯誤",
                description: "修正函數邏輯問題",
                code: `function findMax(arr) {
    let max = 0;
    for (let num of arr) {
        if (num > max) {
            max = num;
        }
    }
    return max;
}

const numbers = [-5, -10, -3, -8];
console.log("最大值:", findMax(numbers));`,
                bugs: [2],
                hints: [
                    "初始值設為0可能不適用於所有情況",
                    "如果所有數字都是負數會怎樣？",
                    "應該初始化為陣列的第一個元素或負無窮大"
                ]
            },
            {
                id: 5,
                title: "關卡 5: 非同步錯誤",
                description: "找出Promise處理中的問題",
                code: `async function fetchData() {
    const response = fetch('https://api.example.com/data');
    const data = await response.json();
    return data;
}

fetchData().then(data => {
    console.log(data);
}).catch(error => {
    console.error(error);
});`,
                bugs: [2],
                hints: [
                    "fetch返回的是Promise",
                    "需要等待fetch完成",
                    "第2行缺少await關鍵字"
                ]
            }
        ];

        let currentChallenge = null;
        let completedLevels = new Set();
        let foundBugs = new Set();
        let hintCount = 0;

        function initLevelSelector() {
            const selector = document.getElementById('levelSelector');
            challenges.forEach((challenge, index) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.textContent = `${challenge.id}`;
                btn.onclick = () => loadChallenge(index);
                if (index > 0 && !completedLevels.has(index - 1)) {
                    btn.classList.add('locked');
                    btn.disabled = true;
                }
                selector.appendChild(btn);
            });
        }

        function loadChallenge(index) {
            currentChallenge = challenges[index];
            foundBugs.clear();
            hintCount = 0;
            
            document.getElementById('challengeTitle').textContent = currentChallenge.title;
            document.getElementById('challengeDesc').textContent = currentChallenge.description;
            document.getElementById('hintBox').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
            
            renderCode();
            updateStats();
            updateProgress();

            // Update active level
            document.querySelectorAll('.level-btn').forEach((btn, i) => {
                btn.classList.remove('active');
                if (i === index) btn.classList.add('active');
            });
        }

        function renderCode() {
            const editor = document.getElementById('codeEditor');
            const lines = currentChallenge.code.split('\n');
            
            editor.innerHTML = lines.map((line, index) => {
                const lineNum = index + 1;
                const isBug = currentChallenge.bugs.includes(lineNum);
                const isFixed = foundBugs.has(lineNum);
                const className = isFixed ? 'code-line fixed' : isBug ? 'code-line bug' : 'code-line';
                
                return `
                    <div class="${className}" data-line="${lineNum}" onclick="clickLine(${lineNum})">
                        <span class="line-number">${lineNum}</span>
                        <span class="line-content">${highlightSyntax(line)}</span>
                    </div>
                `;
            }).join('');
        }

        function highlightSyntax(code) {
            return code
                .replace(/\b(function|const|let|var|if|else|for|return|async|await)\b/g, '<span class="keyword">$1</span>')
                .replace(/("[^"]*"|'[^']*')/g, '<span class="string">$1</span>')
                .replace(/(\/\/.*$)/g, '<span class="comment">$1</span>')
                .replace(/\b(\d+)\b/g, '<span class="number">$1</span>')
                .replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span class="function">$1</span>(');
        }

        function clickLine(lineNum) {
            if (currentChallenge.bugs.includes(lineNum)) {
                foundBugs.add(lineNum);
                renderCode();
                updateStats();
                updateProgress();
                
                if (foundBugs.size === currentChallenge.bugs.length) {
                    completeChallenge();
                }
            }
        }

        function updateStats() {
            if (currentChallenge) {
                document.getElementById('bugsFound').textContent = foundBugs.size;
                document.getElementById('totalBugs').textContent = currentChallenge.bugs.length;
            }
        }

        function updateProgress() {
            if (currentChallenge) {
                const progress = (foundBugs.size / currentChallenge.bugs.length) * 100;
                const bar = document.getElementById('progressBar');
                bar.style.width = progress + '%';
                bar.textContent = Math.round(progress) + '%';
            }
        }

        function showHint() {
            if (!currentChallenge) return;
            
            const hintBox = document.getElementById('hintBox');
            if (hintCount < currentChallenge.hints.length) {
                hintBox.innerHTML = `<strong>提示 ${hintCount + 1}:</strong> ${currentChallenge.hints[hintCount]}`;
                hintBox.classList.add('show');
                hintCount++;
            } else {
                hintBox.innerHTML = `<strong>所有提示已用完！</strong><br>Bug 在第 ${currentChallenge.bugs.join('、')} 行`;
                hintBox.classList.add('show');
            }
        }

        function checkSolution() {
            if (!currentChallenge) return;
            
            if (foundBugs.size === currentChallenge.bugs.length) {
                completeChallenge();
            } else {
                alert(`還有 ${currentChallenge.bugs.length - foundBugs.size} 個 Bug 未找到！`);
            }
        }

        function completeChallenge() {
            document.getElementById('successMessage').classList.add('show');
            const index = challenges.indexOf(currentChallenge);
            completedLevels.add(index);
            
            // Update level buttons
            const buttons = document.querySelectorAll('.level-btn');
            buttons[index].classList.add('completed');
            
            // Unlock next level
            if (index < challenges.length - 1) {
                buttons[index + 1].classList.remove('locked');
                buttons[index + 1].disabled = false;
                
                setTimeout(() => {
                    if (confirm('恭喜完成！要繼續下一關嗎？')) {
                        loadChallenge(index + 1);
                    }
                }, 1000);
            } else {
                setTimeout(() => {
                    alert('🎉 恭喜完成所有關卡！你是程式碼偵探大師！');
                }, 1000);
            }
        }

        // Initialize
        initLevelSelector();
        loadChallenge(0);
    </script>
</body>
</html>
