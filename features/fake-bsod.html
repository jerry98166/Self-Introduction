    </div>

    <script>
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 3;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                document.getElementById('revealBtn').classList.add('show');
            }
            document.getElementById('percent').textContent = Math.floor(progress);
        }, 100);
        
        function reveal() {
