<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 全球訪客地圖 - Global Visitor Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .panel h2 {
            margin-bottom: 15px;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #map {
            height: 500px;
            border-radius: 10px;
            background: #1a1a2e;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .visitor-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .visitor-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .visitor-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        .visitor-flag {
            font-size: 2em;
            width: 50px;
            text-align: center;
        }

        .visitor-info {
            flex: 1;
        }

        .visitor-country {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .visitor-details {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .visitor-count {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .country-chart {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .chart-label {
            min-width: 100px;
            font-size: 0.9em;
        }

        .chart-fill {
            flex: 1;
            height: 25px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .chart-progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(0,255,0,0.1);
            border-radius: 8px;
            border: 2px solid rgba(0,255,0,0.3);
            margin-bottom: 15px;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .timeline {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .timeline-item {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .timeline-item:last-child {
            border-bottom: none;
        }

        .timeline-time {
            color: #667eea;
            font-size: 0.85em;
            min-width: 60px;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-title {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .timeline-desc {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            #map {
                height: 300px;
            }
        }

        /* 自定義滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 全球訪客地圖</h1>
            <p class="subtitle">即時追蹤來自世界各地的訪客</p>
        </header>

        <div class="main-grid">
            <!-- 左側：地圖 -->
            <div>
                <div class="panel">
                    <h2>🗺️ 互動式世界地圖</h2>
                    <div class="live-indicator">
                        <div class="live-dot"></div>
                        <span><strong id="currentVisitors">12</strong> 位訪客正在線上</span>
                    </div>
                    <div id="map"></div>
                </div>

                <!-- 統計數據 -->
                <div class="panel" style="margin-top: 20px;">
                    <h2>📊 訪客統計</h2>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-icon">👥</div>
                            <div class="stat-value" id="totalVisitors">1,234</div>
                            <div class="stat-label">總訪客數</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-icon">🌐</div>
                            <div class="stat-value" id="totalCountries">48</div>
                            <div class="stat-label">來訪國家</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-icon">📈</div>
                            <div class="stat-value" id="todayVisitors">156</div>
                            <div class="stat-label">今日訪客</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-icon">⭐</div>
                            <div class="stat-value" id="peakHour">18:00</div>
                            <div class="stat-label">高峰時段</div>
                        </div>
                    </div>
                </div>

                <!-- 國家排行 -->
                <div class="panel" style="margin-top: 20px;">
                    <h2>🏆 訪客來源排行</h2>
                    <div class="country-chart" id="countryChart"></div>
                </div>
            </div>

            <!-- 右側：訪客列表 -->
            <div>
                <div class="panel">
                    <h2>👤 最近訪客</h2>
                    <div class="filter-buttons">
                        <button class="filter-btn active" onclick="filterVisitors('all')">全部</button>
                        <button class="filter-btn" onclick="filterVisitors('online')">線上</button>
                        <button class="filter-btn" onclick="filterVisitors('today')">今日</button>
                    </div>
                    <div class="visitor-list" id="visitorList"></div>
                </div>

                <div class="panel" style="margin-top: 20px;">
                    <h2>⏱️ 活動時間軸</h2>
                    <div class="timeline" id="timeline"></div>
                </div>
            </div>
        </div>
    </div>

    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 訪客數據
        let visitors = [];
        let map;
        let markers = [];

        // 國家和城市數據
        const locations = [
            { country: '台灣', city: '台北', flag: '🇹🇼', lat: 25.0330, lng: 121.5654, count: 156 },
            { country: '美國', city: '紐約', flag: '🇺🇸', lat: 40.7128, lng: -74.0060, count: 89 },
            { country: '日本', city: '東京', flag: '🇯🇵', lat: 35.6762, lng: 139.6503, count: 78 },
            { country: '英國', city: '倫敦', flag: '🇬🇧', lat: 51.5074, lng: -0.1278, count: 65 },
            { country: '德國', city: '柏林', flag: '🇩🇪', lat: 52.5200, lng: 13.4050, count: 54 },
            { country: '法國', city: '巴黎', flag: '🇫🇷', lat: 48.8566, lng: 2.3522, count: 48 },
            { country: '韓國', city: '首爾', flag: '🇰🇷', lat: 37.5665, lng: 126.9780, count: 45 },
            { country: '加拿大', city: '多倫多', flag: '🇨🇦', lat: 43.6532, lng: -79.3832, count: 38 },
            { country: '澳洲', city: '雪梨', flag: '🇦🇺', lat: -33.8688, lng: 151.2093, count: 32 },
            { country: '新加坡', city: '新加坡', flag: '🇸🇬', lat: 1.3521, lng: 103.8198, count: 28 },
            { country: '中國', city: '上海', flag: '🇨🇳', lat: 31.2304, lng: 121.4737, count: 95 },
            { country: '印度', city: '孟買', flag: '🇮🇳', lat: 19.0760, lng: 72.8777, count: 42 },
            { country: '巴西', city: '聖保羅', flag: '🇧🇷', lat: -23.5505, lng: -46.6333, count: 25 },
            { country: '荷蘭', city: '阿姆斯特丹', flag: '🇳🇱', lat: 52.3676, lng: 4.9041, count: 22 },
            { country: '西班牙', city: '馬德里', flag: '🇪🇸', lat: 40.4168, lng: -3.7038, count: 20 }
        ];

        // 初始化地圖
        function initMap() {
            map = L.map('map', {
                center: [20, 0],
                zoom: 2,
                minZoom: 2,
                maxZoom: 10,
                worldCopyJump: true
            });

            // 使用深色主題地圖
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // 添加標記
            addMarkers();
        }

        // 添加地圖標記
        function addMarkers() {
            locations.forEach(location => {
                const marker = L.circleMarker([location.lat, location.lng], {
                    radius: Math.log(location.count) * 3,
                    fillColor: '#667eea',
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.7
                }).addTo(map);

                marker.bindPopup(`
                    <div style="color: #333; padding: 10px;">
                        <div style="font-size: 2em; margin-bottom: 5px;">${location.flag}</div>
                        <strong style="font-size: 1.2em;">${location.city}, ${location.country}</strong><br>
                        <span style="color: #667eea; font-weight: 600;">${location.count} 位訪客</span>
                    </div>
                `);

                markers.push(marker);

                // 添加脈衝動畫（隨機）
                if (Math.random() > 0.7) {
                    setInterval(() => {
                        marker.setStyle({ fillOpacity: 0.3 });
                        setTimeout(() => marker.setStyle({ fillOpacity: 0.7 }), 500);
                    }, 3000);
                }
            });
        }

        // 生成訪客列表
        function generateVisitors() {
            visitors = [];
            locations.forEach(location => {
                const visitCount = Math.floor(Math.random() * 5) + 1;
                for (let i = 0; i < visitCount; i++) {
                    visitors.push({
                        ...location,
                        id: Date.now() + Math.random(),
                        time: new Date(Date.now() - Math.random() * 86400000),
                        isOnline: Math.random() > 0.7,
                        browser: ['Chrome', 'Firefox', 'Safari', 'Edge'][Math.floor(Math.random() * 4)],
                        device: ['Desktop', 'Mobile', 'Tablet'][Math.floor(Math.random() * 3)]
                    });
                }
            });
            visitors.sort((a, b) => b.time - a.time);
        }

        // 渲染訪客列表
        function renderVisitorList(filter = 'all') {
            const container = document.getElementById('visitorList');
            let filteredVisitors = visitors;

            if (filter === 'online') {
                filteredVisitors = visitors.filter(v => v.isOnline);
            } else if (filter === 'today') {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                filteredVisitors = visitors.filter(v => v.time >= today);
            }

            container.innerHTML = filteredVisitors.slice(0, 20).map(visitor => `
                <div class="visitor-item" onclick="focusLocation(${visitor.lat}, ${visitor.lng})">
                    <div class="visitor-flag">${visitor.flag}</div>
                    <div class="visitor-info">
                        <div class="visitor-country">${visitor.city}, ${visitor.country}</div>
                        <div class="visitor-details">
                            ${visitor.browser} • ${visitor.device} • ${formatTime(visitor.time)}
                        </div>
                    </div>
                    ${visitor.isOnline ? '<div class="visitor-count">線上</div>' : ''}
                </div>
            `).join('');
        }

        // 渲染國家排行圖表
        function renderCountryChart() {
            const sortedLocations = [...locations].sort((a, b) => b.count - a.count).slice(0, 8);
            const maxCount = sortedLocations[0].count;

            const container = document.getElementById('countryChart');
            container.innerHTML = sortedLocations.map(location => `
                <div class="chart-bar">
                    <div class="chart-label">${location.flag} ${location.country}</div>
                    <div class="chart-fill">
                        <div class="chart-progress" style="width: ${(location.count / maxCount) * 100}%">
                            ${location.count}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染時間軸
        function renderTimeline() {
            const container = document.getElementById('timeline');
            const recentVisitors = visitors.slice(0, 15);

            container.innerHTML = recentVisitors.map(visitor => `
                <div class="timeline-item">
                    <div class="timeline-time">${formatTimeShort(visitor.time)}</div>
                    <div class="timeline-content">
                        <div class="timeline-title">${visitor.flag} ${visitor.country}</div>
                        <div class="timeline-desc">來自 ${visitor.city} 的訪客使用 ${visitor.browser}</div>
                    </div>
                </div>
            `).join('');
        }

        // 聚焦到特定位置
        function focusLocation(lat, lng) {
            map.setView([lat, lng], 6, { animate: true });
        }

        // 篩選訪客
        function filterVisitors(filter) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderVisitorList(filter);
        }

        // 格式化時間
        function formatTime(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return '剛剛';
            if (diff < 3600) return `${Math.floor(diff / 60)} 分鐘前`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} 小時前`;
            return `${Math.floor(diff / 86400)} 天前`;
        }

        function formatTimeShort(date) {
            return date.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        }

        // 更新統計數據
        function updateStats() {
            const onlineCount = visitors.filter(v => v.isOnline).length;
            document.getElementById('currentVisitors').textContent = onlineCount;

            // 模擬即時數據更新
            setInterval(() => {
                const newCount = onlineCount + Math.floor(Math.random() * 5) - 2;
                document.getElementById('currentVisitors').textContent = Math.max(0, newCount);
            }, 5000);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            generateVisitors();
            renderVisitorList();
            renderCountryChart();
            renderTimeline();
            updateStats();

            // 每 10 秒更新一次時間軸
            setInterval(() => {
                // 添加新訪客
                const randomLocation = locations[Math.floor(Math.random() * locations.length)];
                visitors.unshift({
                    ...randomLocation,
                    id: Date.now() + Math.random(),
                    time: new Date(),
                    isOnline: true,
                    browser: ['Chrome', 'Firefox', 'Safari', 'Edge'][Math.floor(Math.random() * 4)],
                    device: ['Desktop', 'Mobile', 'Tablet'][Math.floor(Math.random() * 3)]
                });

                if (visitors.length > 100) visitors.pop();

                renderTimeline();
            }, 10000);
        });
    </script>
    <script defer src="../assets/js/security-hardening.js"></script>
</body>
</html>
