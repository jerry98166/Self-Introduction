<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤚 手勢識別控制 - Gesture Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .panel h2 {
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #videoContainer {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #startBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        #stopBtn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-top: 15px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.active {
            background: #00ff00;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .gesture-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .gesture-card {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .gesture-card.detected {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
            transform: scale(1.05);
        }

        .gesture-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .gesture-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .gesture-action {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .info-box {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: 700;
        }

        .demo-area {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .demo-object {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .log-container {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .log-time {
            color: #00ff00;
            margin-right: 10px;
        }

        .warning {
            background: rgba(255, 193, 7, 0.2);
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .gesture-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤚 手勢識別控制系統</h1>
            <p class="subtitle">使用 TensorFlow.js HandPose 進行即時手勢識別</p>
        </header>

        <div class="main-grid">
            <!-- 左側：攝影機與控制 -->
            <div class="panel">
                <h2>📹 攝影機畫面</h2>
                <div id="videoContainer">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="controls">
                    <button id="startBtn">🚀 啟動識別</button>
                    <button id="stopBtn" disabled>⏹️ 停止</button>
                </div>
                <div class="status">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <div id="statusText">等待啟動...</div>
                </div>
                <div class="warning">
                    ⚠️ 此功能需要攝影機權限。首次使用時瀏覽器會請求授權。
                </div>
            </div>

            <!-- 右側：手勢列表 -->
            <div class="panel">
                <h2>✋ 可識別手勢</h2>
                <div class="gesture-list">
                    <div class="gesture-card" data-gesture="thumbs_up">
                        <div class="gesture-icon">👍</div>
                        <div class="gesture-name">讚</div>
                        <div class="gesture-action">放大物件</div>
                    </div>
                    <div class="gesture-card" data-gesture="thumbs_down">
                        <div class="gesture-icon">👎</div>
                        <div class="gesture-name">倒讚</div>
                        <div class="gesture-action">縮小物件</div>
                    </div>
                    <div class="gesture-card" data-gesture="peace">
                        <div class="gesture-icon">✌️</div>
                        <div class="gesture-name">比二</div>
                        <div class="gesture-action">旋轉物件</div>
                    </div>
                    <div class="gesture-card" data-gesture="ok">
                        <div class="gesture-icon">👌</div>
                        <div class="gesture-name">OK</div>
                        <div class="gesture-action">重置位置</div>
                    </div>
                    <div class="gesture-card" data-gesture="fist">
                        <div class="gesture-icon">✊</div>
                        <div class="gesture-name">握拳</div>
                        <div class="gesture-action">移動物件</div>
                    </div>
                    <div class="gesture-card" data-gesture="open_palm">
                        <div class="gesture-icon">🖐️</div>
                        <div class="gesture-name">張開手掌</div>
                        <div class="gesture-action">停止動作</div>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-box">
                        <div class="info-label">偵測到的手勢</div>
                        <div class="info-value" id="gestureCount">0</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">當前手勢</div>
                        <div class="info-value" id="currentGesture">--</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">FPS</div>
                        <div class="info-value" id="fpsDisplay">0</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">信心度</div>
                        <div class="info-value" id="confidence">0%</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 互動演示區 -->
        <div class="panel">
            <h2>🎮 互動演示區</h2>
            <div class="demo-area" id="demoArea">
                <div class="demo-object" id="demoObject">🎯</div>
                <p style="margin-top: 20px; opacity: 0.8;">使用手勢控制上方物件</p>
            </div>
        </div>

        <!-- 操作日誌 -->
        <div class="panel">
            <h2>📋 操作日誌</h2>
            <div class="log-container" id="logContainer">
                <div class="log-entry">
                    <span class="log-time">[系統]</span> 手勢識別系統已準備就緒
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全域變數
        let video, canvas, ctx;
        let model = null;
        let isRunning = false;
        let animationId = null;
        let gestureCount = 0;
        let lastGesture = null;
        let fpsHistory = [];
        let lastTime = Date.now();

        // Demo object 狀態
        let demoObject = {
            x: 0,
            y: 0,
            scale: 1,
            rotation: 0
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            video = document.getElementById('webcam');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            document.getElementById('startBtn').addEventListener('click', startGestureRecognition);
            document.getElementById('stopBtn').addEventListener('click', stopGestureRecognition);

            addLog('系統初始化完成');
        });

        // 啟動手勢識別
        async function startGestureRecognition() {
            try {
                updateStatus('正在啟動攝影機...', false);
                addLog('請求攝影機權限...');

                // 啟動攝影機
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                video.srcObject = stream;

                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });

                updateStatus('正在載入 AI 模型...', false);
                addLog('開始載入 TensorFlow.js HandPose 模型...');

                // 模擬模型載入（實際專案中使用 @tensorflow-models/handpose）
                await simulateModelLoading();

                updateStatus('手勢識別運行中', true);
                addLog('✅ 模型載入完成，開始識別手勢');

                isRunning = true;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;

                detectGestures();

            } catch (error) {
                addLog('❌ 錯誤: ' + error.message, 'error');
                updateStatus('啟動失敗', false);
                alert('無法存取攝影機: ' + error.message);
            }
        }

        // 停止手勢識別
        function stopGestureRecognition() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            updateStatus('已停止', false);
            addLog('手勢識別已停止');

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        // 模擬模型載入
        function simulateModelLoading() {
            return new Promise(resolve => setTimeout(resolve, 2000));
        }

        // 手勢檢測主循環
        async function detectGestures() {
            if (!isRunning) return;

            // 繪製影像到 canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 模擬手勢識別（實際會使用 TensorFlow.js）
            const gesture = await simulateGestureDetection();

            if (gesture) {
                handleGesture(gesture);
            }

            // 更新 FPS
            updateFPS();

            // 渲染 demo 物件
            renderDemoObject();

            animationId = requestAnimationFrame(detectGestures);
        }

        // 模擬手勢偵測
        async function simulateGestureDetection() {
            // 模擬每 2-3 秒偵測到隨機手勢
            if (Math.random() < 0.02) {
                const gestures = ['thumbs_up', 'thumbs_down', 'peace', 'ok', 'fist', 'open_palm'];
                const randomGesture = gestures[Math.floor(Math.random() * gestures.length)];
                return {
                    name: randomGesture,
                    confidence: 0.85 + Math.random() * 0.15
                };
            }
            return null;
        }

        // 處理識別到的手勢
        function handleGesture(gesture) {
            if (gesture.name === lastGesture) return;

            lastGesture = gesture.name;
            gestureCount++;

            // 更新 UI
            document.getElementById('gestureCount').textContent = gestureCount;
            document.getElementById('currentGesture').textContent = getGestureName(gesture.name);
            document.getElementById('confidence').textContent = Math.round(gesture.confidence * 100) + '%';

            // 高亮手勢卡片
            document.querySelectorAll('.gesture-card').forEach(card => {
                card.classList.remove('detected');
            });
            const card = document.querySelector(`[data-gesture="${gesture.name}"]`);
            if (card) {
                card.classList.add('detected');
                setTimeout(() => card.classList.remove('detected'), 1500);
            }

            // 執行對應動作
            executeGestureAction(gesture.name);

            // 記錄日誌
            addLog(`偵測到手勢: ${getGestureName(gesture.name)} (${Math.round(gesture.confidence * 100)}%)`);
        }

        // 執行手勢對應動作
        function executeGestureAction(gestureName) {
            const obj = document.getElementById('demoObject');

            switch (gestureName) {
                case 'thumbs_up':
                    demoObject.scale = Math.min(demoObject.scale + 0.2, 2);
                    addLog('➕ 物件放大');
                    break;
                case 'thumbs_down':
                    demoObject.scale = Math.max(demoObject.scale - 0.2, 0.5);
                    addLog('➖ 物件縮小');
                    break;
                case 'peace':
                    demoObject.rotation += 45;
                    addLog('🔄 物件旋轉');
                    break;
                case 'ok':
                    demoObject.x = 0;
                    demoObject.y = 0;
                    demoObject.scale = 1;
                    demoObject.rotation = 0;
                    addLog('🔄 重置物件位置');
                    break;
                case 'fist':
                    demoObject.x = (Math.random() - 0.5) * 100;
                    demoObject.y = (Math.random() - 0.5) * 100;
                    addLog('📍 移動物件');
                    break;
                case 'open_palm':
                    addLog('⏸️ 停止所有動作');
                    break;
            }
        }

        // 渲染 demo 物件
        function renderDemoObject() {
            const obj = document.getElementById('demoObject');
            obj.style.transform = `
                translate(${demoObject.x}px, ${demoObject.y}px)
                scale(${demoObject.scale})
                rotate(${demoObject.rotation}deg)
            `;
        }

        // 更新 FPS
        function updateFPS() {
            const now = Date.now();
            const delta = now - lastTime;
            const fps = 1000 / delta;

            fpsHistory.push(fps);
            if (fpsHistory.length > 30) fpsHistory.shift();

            const avgFps = fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length;
            document.getElementById('fpsDisplay').textContent = Math.round(avgFps);

            lastTime = now;
        }

        // 獲取手勢名稱
        function getGestureName(gesture) {
            const names = {
                'thumbs_up': '👍 讚',
                'thumbs_down': '👎 倒讚',
                'peace': '✌️ 比二',
                'ok': '👌 OK',
                'fist': '✊ 握拳',
                'open_palm': '🖐️ 張開手掌'
            };
            return names[gesture] || gesture;
        }

        // 更新狀態
        function updateStatus(text, active) {
            document.getElementById('statusText').textContent = text;
            const indicator = document.getElementById('statusIndicator');
            if (active) {
                indicator.classList.add('active');
            } else {
                indicator.classList.remove('active');
            }
        }

        // 添加日誌
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            const time = new Date().toLocaleTimeString('zh-TW');
            const icon = type === 'error' ? '❌' : '✅';

            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                ${icon} ${message}
            `;

            logContainer.insertBefore(entry, logContainer.firstChild);

            // 限制日誌數量
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }
    </script>
</body>
</html>
