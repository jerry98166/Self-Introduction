<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🎨 調色盤工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b            b      inp            b     display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
        }
        .palette-item {
            height: 80px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .palette-item:hover { transform: scale(1.1); }
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 調色盤工具</h1>
        
        <div class="main-panel">
            <div class="color-display" id="colorDisplay"></div>
            
            <div class="color-inputs">
                <div class="input-group">
                    <label>HEX 顏色碼</label>
                    <input type="text" id="hexInput" value="#667eea" oninput="updateFromHex()">
                </div>
                <div class="input-group">
                    <label>RGB</label>
                    <input type="text" id="rgbInput" value="rgb(102, 126, 234)" oninput="updateFromRGB()">
                </div>
                <div class="input-group">
                    <label>拾色器</label>
                    <input type="color" id="colorPicker" value="#667eea" oninput="updateFromPicker()">
                </div>
            </div>
            
            <h3 style="margin-bottom: 15px;">🎨 預設調色盤</h3>
            <div class="palette-grid" id="palette"></div>
        </div>
        
        <div style="text-align: center;">
            <a href="../pages/lab.html" class="back-btn">← 返回功能實驗室</a>
        </div>
    </div>
    <script>
        const colors = [
            '#667eea', '#764ba2', '#f093fb', '#4facfe', 
            '#43e97b', '#38f9d7', '#fa709a', '#fee140',
            '#30cfd0', '#330867', '#a8edea', '#fed6e3',
            '#f6d365', '#fda085', '#fbc2eb', '#a6c1ee'
        ];
        
        const display = document.getElementById('colorDisplay');
        const hexInput = document.getElementById('hexInput');
        const rgbInput = document.getElementById('rgbInput');
        const colorPicker = document.getElementById('colorPicker');
        
        function updateColor(hex) {
            display.style.background = hex;
            hexInput.value = hex;
            colorPicker.value = hex;
            rgbInput.value = hexToRGB(hex);
        }
        
        function hexToRGB(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return \`rgb(\${r}, \${g}, \${b})\`;
        }
        
        function updateFromHex() {
            updateColor(hexInput.value);
        }
        
        function updateFromPicker() {
            updateColor(colorPicker.value);
        }
        
        function updateFromRGB() {
            // Simplified - just update display
            display.style.background = rgbInput.value;
        }
        
        const palette = document.getElementById('palette');
        colors.forEach(color => {
            const item = document.createElement('div');
            item.className = 'palette-item';
            item.style.background = color;
            item.onclick = () => updateColor(color);
            palette.appendChild(item);
        });
        
        updateColor('#667eea');
    </script>
    <script defer src="../assets/js/security-hardening.js"></script>
</body>
</html>
