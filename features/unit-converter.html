<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>📏 單位轉換器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; }
        .converter-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

            display: grid;
            grid-template-columns: 1fr auto 1fr;

        }
        select, input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .convert-icon { font-size: 2em; text-align: center; }
        .result {
            font-size: 1.5em;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            text-align: center;
            margin-top: 10px;
        }
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📏 單位轉換器</h1>
        
        <div class="converter-panel">
            <div class="category-tabs">
                <div class="tab active" onclick="switchCategory('length')">📏 長度</div>
                <div class="tab" onclick="switchCategory('weight')">⚖️ 重量</div>
                <div class="tab" onclick="switchCategory('temperature')">🌡️ 溫度</div>
                <div class="tab" onclick="switchCategory('data')">💾 資料大小</div>
            </div>
            
            <div class="converter-grid">
                <div>
                    <select id="fromUnit"></select>
                    <input type="number" id="fromValue" value="1" oninput="convert()">
                    <div class="result" id="fromResult">1</div>
                </div>
                
                <div class="convert-icon">⇄</div>
                
                <div>
                    <select id="toUnit" onchange="convert()"></select>
                    <div class="result" id="toResult">-</div>
                </div>
            </div>
        </div>
        
        <div style="text-align: center;">
            <a href="../lab.html" class="back-btn">← 返回功能實驗室</a>
        </div>
    </div>
    <script>
        const conversions = {
            length: {
                units: ['公尺 (m)', '公分 (cm)', '公里 (km)', '英寸 (in)', '英尺 (ft)', '碼 (yd)', '英里 (mile)'],
                toBase: [1, 0.01, 1000, 0.0254, 0.3048, 0.9144, 1609.34]
            },
            weight: {
                units: ['公斤 (kg)', '公克 (g)', '毫克 (mg)', '磅 (lb)', '盎司 (oz)', '噸 (t)'],
                toBase: [1, 0.001, 0.000001, 0.453592, 0.0283495, 1000]
            },
            temperature: {
                units: ['攝氏 (°C)', '華氏 (°F)', '開氏 (K)'],
                special: true
            },
            data: {
                units: ['位元組 (B)', 'KB', 'MB', 'GB', 'TB'],
                toBase: [1, 1024, 1048576, 1073741824, 1099511627776]
            }
        };
        
        let currentCategory = 'length';
        
        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadUnits();
        }
        
        function loadUnits() {
            const fromSelect = document.getElementById('fromUnit');
            const toSelect = document.getElementById('toUnit');
            const units = conversions[currentCategory].units;
            
            fromSelect.innerHTML = units.map((u, i) => \`<option value="\${i}">\${u}</option>\`).join('');
            toSelect.innerHTML = units.map((u, i) => \`<option value="\${i}" \${i === 1 ? 'selected' : ''}>\${u}</option>\`).join('');
            
            convert();
        }
        
        function convert() {
            const fromValue = parseFloat(document.getElementById('fromValue').value) || 0;
            const fromUnit = parseInt(document.getElementById('fromUnit').value);
            const toUnit = parseInt(document.getElementById('toUnit').value);
            
            let result;
            
            if (conversions[currentCategory].special) {
                // Temperature conversion
                if (fromUnit === 0) { // Celsius
                    result = toUnit === 1 ? (fromValue * 9/5 + 32) : (fromValue + 273.15);
                } else if (fromUnit === 1) { // Fahrenheit
                    result = toUnit === 0 ? ((fromValue - 32) * 5/9) : ((fromValue - 32) * 5/9 + 273.15);
                } else { // Kelvin
                    result = toUnit === 0 ? (fromValue - 273.15) : ((fromValue - 273.15) * 9/5 + 32);
                }
            } else {
                const toBase = conversions[currentCategory].toBase;
                const baseValue = fromValue * toBase[fromUnit];
                result = baseValue / toBase[toUnit];
            }
            
            document.getElementById('toResult').textContent = result.toFixed(6);
        }
        
        loadUnits();
    </script>
</body>
</html>
