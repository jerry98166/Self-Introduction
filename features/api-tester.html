<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 API 測試工具 - API Testing Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .panel h2 {
            margin-bottom: 20px;
            font-size: 1.4em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .method-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .method-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .method-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .method-btn.active {
            background: #3498db;
            border-color: #3498db;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1em;
            font-family: 'Courier New', monospace;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: rgba(255,255,255,0.5);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .header-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .header-input-group input {
            flex: 1;
        }

        .add-header-btn,
        .send-btn {
            padding: 12px 30px;
            background: #27ae60;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-header-btn:hover,
        .send-btn:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .send-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .send-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
        }

        .header-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .header-item span {
            flex: 1;
            font-family: 'Courier New', monospace;
        }

        .remove-btn {
            padding: 5px 10px;
            background: #e74c3c;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .response-panel {
            grid-column: 1 / -1;
        }

        .response-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #3498db;
        }

        .response-content {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
        }

        .response-content pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            margin-right: 10px;
        }

        .status-200 { background: #27ae60; }
        .status-400 { background: #f39c12; }
        .status-500 { background: #e74c3c; }

        .response-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .examples {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .examples h3 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .example-btn {
            padding: 8px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .example-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
            border: 2px solid white;
        }

        .back-btn:hover {
            background: white;
            color: #2c3e50;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 API 測試工具</h1>
            <p class="subtitle">測試任何 REST API 端點並查看回應</p>
        </header>

        <div class="main-grid">
            <div class="panel">
                <h2>📡 請求設定</h2>
                
                <div class="form-group">
                    <label>HTTP 方法</label>
                    <div class="method-selector">
                        <button class="method-btn active" data-method="GET">GET</button>
                        <button class="method-btn" data-method="POST">POST</button>
                        <button class="method-btn" data-method="PUT">PUT</button>
                        <button class="method-btn" data-method="DELETE">DELETE</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>API URL</label>
                    <input type="text" id="apiUrl" placeholder="https://api.example.com/endpoint">
                </div>

                <div class="form-group" id="bodyGroup" style="display: none;">
                    <label>請求主體 (JSON)</label>
                    <textarea id="requestBody" placeholder='{&#10;  "key": "value"&#10;}'></textarea>
                </div>

                <div class="examples">
                    <h3>📝 範例 API</h3>
                    <button class="example-btn" onclick="loadExample('jsonplaceholder')">JSONPlaceholder</button>
                    <button class="example-btn" onclick="loadExample('github')">GitHub API</button>
                    <button class="example-btn" onclick="loadExample('weather')">天氣 API</button>
                </div>

                <button class="send-btn" id="sendBtn" onclick="sendRequest()">🚀 發送請求</button>
            </div>

            <div class="panel">
                <h2>🏷️ Headers</h2>
                
                <div id="headersList">
                    <!-- Headers will be added here -->
                </div>

                <div class="header-input-group">
                    <input type="text" id="headerKey" placeholder="Header名稱 (如 Content-Type)">
                    <input type="text" id="headerValue" placeholder="Header值 (如 application/json)">
                </div>
                <button class="add-header-btn" onclick="addHeader()">➕ 新增 Header</button>

                <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <h3 style="margin-bottom: 10px; font-size: 1em;">常用 Headers:</h3>
                    <small style="opacity: 0.8;">
                        • Content-Type: application/json<br>
                        • Authorization: Bearer token<br>
                        • Accept: application/json
                    </small>
                </div>
            </div>

            <div class="panel response-panel" id="responsePanel" style="display: none;">
                <h2>📥 回應</h2>
                
                <div class="response-meta" id="responseMeta"></div>

                <div class="response-tabs">
                    <button class="tab-btn active" onclick="switchTab('body')">回應主體</button>
                    <button class="tab-btn" onclick="switchTab('headers')">回應 Headers</button>
                    <button class="tab-btn" onclick="switchTab('raw')">原始資料</button>
                </div>

                <div class="response-content" id="responseContent"></div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="../pages/lab.html" class="back-btn">← 返回功能實驗室</a>
        </div>
    </div>

    <script>
        let currentMethod = 'GET';
        let headers = {};
        let currentResponse = null;
        let currentTab = 'body';

        // Method selection
        document.querySelectorAll('.method-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMethod = this.dataset.method;
                
                // Show/hide body input based on method
                const bodyGroup = document.getElementById('bodyGroup');
                if (currentMethod === 'POST' || currentMethod === 'PUT') {
                    bodyGroup.style.display = 'block';
                } else {
                    bodyGroup.style.display = 'none';
                }
            });
        });

        function addHeader() {
            const key = document.getElementById('headerKey').value.trim();
            const value = document.getElementById('headerValue').value.trim();

            if (!key || !value) {
                alert('請填寫 Header 名稱和值');
                return;
            }

            headers[key] = value;
            renderHeaders();
            
            document.getElementById('headerKey').value = '';
            document.getElementById('headerValue').value = '';
        }

        function removeHeader(key) {
            delete headers[key];
            renderHeaders();
        }

        function renderHeaders() {
            const headersList = document.getElementById('headersList');
            headersList.innerHTML = Object.entries(headers).map(([key, value]) => `
                <div class="header-item">
                    <span><strong>${key}:</strong> ${value}</span>
                    <button class="remove-btn" onclick="removeHeader('${key}')">✕</button>
                </div>
            `).join('');
        }

        async function sendRequest() {
            const url = document.getElementById('apiUrl').value.trim();
            
            if (!url) {
                alert('請輸入 API URL');
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳ 發送中...';

            const responsePanel = document.getElementById('responsePanel');
            const responseContent = document.getElementById('responseContent');
            
            responsePanel.style.display = 'block';
            responseContent.innerHTML = '<div class="loading"><div class="spinner"></div><div>正在請求...</div></div>';

            const startTime = Date.now();

            try {
                const options = {
                    method: currentMethod,
                    headers: headers
                };

                if ((currentMethod === 'POST' || currentMethod === 'PUT') && document.getElementById('requestBody').value.trim()) {
                    options.body = document.getElementById('requestBody').value.trim();
                }

                const response = await fetch(url, options);
                const endTime = Date.now();
                const duration = endTime - startTime;

                const contentType = response.headers.get('content-type');
                let responseData;
                
                if (contentType && contentType.includes('application/json')) {
                    responseData = await response.json();
                } else {
                    responseData = await response.text();
                }

                currentResponse = {
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries(response.headers.entries()),
                    data: responseData,
                    duration: duration,
                    url: url,
                    method: currentMethod
                };

                displayResponse();

            } catch (error) {
                responseContent.innerHTML = `
                    <div style="color: #e74c3c;">
                        <h3>❌ 錯誤</h3>
                        <pre>${error.message}</pre>
                    </div>
                `;
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '🚀 發送請求';
            }
        }

        function displayResponse() {
            if (!currentResponse) return;

            // Display meta info
            const statusClass = currentResponse.status < 300 ? 'status-200' : 
                               currentResponse.status < 500 ? 'status-400' : 'status-500';
            
            document.getElementById('responseMeta').innerHTML = `
                <div class="meta-item">
                    <span class="status-badge ${statusClass}">${currentResponse.status} ${currentResponse.statusText}</span>
                </div>
                <div class="meta-item">
                    ⏱️ <strong>${currentResponse.duration}ms</strong>
                </div>
                <div class="meta-item">
                    📏 <strong>${JSON.stringify(currentResponse.data).length} bytes</strong>
                </div>
            `;

            switchTab(currentTab);
        }

        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event?.target?.classList.add('active');

            const content = document.getElementById('responseContent');
            
            if (!currentResponse) return;

            switch(tab) {
                case 'body':
                    content.innerHTML = `<pre>${JSON.stringify(currentResponse.data, null, 2)}</pre>`;
                    break;
                case 'headers':
                    content.innerHTML = `<pre>${JSON.stringify(currentResponse.headers, null, 2)}</pre>`;
                    break;
                case 'raw':
                    const raw = {
                        url: currentResponse.url,
                        method: currentResponse.method,
                        status: currentResponse.status,
                        statusText: currentResponse.statusText,
                        headers: currentResponse.headers,
                        body: currentResponse.data
                    };
                    content.innerHTML = `<pre>${JSON.stringify(raw, null, 2)}</pre>`;
                    break;
            }
        }

        function loadExample(type) {
            switch(type) {
                case 'jsonplaceholder':
                    document.getElementById('apiUrl').value = 'https://jsonplaceholder.typicode.com/posts/1';
                    currentMethod = 'GET';
                    headers = {};
                    break;
                case 'github':
                    document.getElementById('apiUrl').value = 'https://api.github.com/users/github';
                    currentMethod = 'GET';
                    headers = {'Accept': 'application/vnd.github.v3+json'};
                    break;
                case 'weather':
                    document.getElementById('apiUrl').value = 'https://wttr.in/Taipei?format=j1';
                    currentMethod = 'GET';
                    headers = {};
                    break;
            }
            
            document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-method="${currentMethod}"]`).classList.add('active');
            document.getElementById('bodyGroup').style.display = 'none';
            renderHeaders();
        }
    </script>
</body>
</html>
