<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - 頁面未找到 | 高孟麟的個人網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        .error-container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .error-code {
            font-size: 150px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            animation: glitch 1s infinite;
        }
        
        @keyframes glitch {
            0%, 100% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
        }
        
        .error-title {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 35px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-3px);
        }
        
        .suggestions {
            margin-top: 60px;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .suggestions h3 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        
        .suggestions ul {
            list-style: none;
            text-align: left;
        }
        
        .suggestions li {
            margin-bottom: 15px;
            padding-left: 30px;
            position: relative;
        }
        
        .suggestions li::before {
            content: "→";
            position: absolute;
            left: 0;
            font-weight: bold;
        }
        
        .suggestions a {
            color: white;
            text-decoration: underline;
            transition: opacity 0.3s ease;
        }
        
        .suggestions a:hover {
            opacity: 0.8;
        }
        
        /* 背景動畫 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: float 20s infinite;
        }
        
        .circle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .circle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 50%;
            left: 80%;
            animation-delay: 2s;
        }
        
        .circle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 80%;
            left: 20%;
            animation-delay: 4s;
        }
        
        .circle:nth-child(4) {
            width: 100px;
            height: 100px;
            top: 30%;
            left: 70%;
            animation-delay: 1s;
        }
        
        .circle:nth-child(5) {
            width: 150px;
            height: 150px;
            top: 70%;
            left: 60%;
            animation-delay: 3s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-50px) rotate(180deg);
            }
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 100px;
            }
            
            .error-title {
                font-size: 28px;
            }
            
            .error-message {
                font-size: 16px;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
    
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">哎呀！頁面不見了</h1>
        <p class="error-message">
            很抱歉，您要找的頁面似乎已經搬家或不存在了。<br>
            但別擔心，我們有其他精彩內容等著您！
        </p>
        
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <span>🏠</span>
                <span>返回首頁</span>
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <span>←</span>
                <span>返回上一頁</span>
            </a>
        </div>
        
        <div class="suggestions">
            <h3>✨ 你可能想要：</h3>
            <ul>
                <li><a href="/">查看我的個人簡介和技能</a></li>
                <li><a href="/pages/lab.html">探索功能實驗室的互動功能</a></li>
                <li><a href="/#projects">瀏覽我的專案作品</a></li>
                <li><a href="/#contact">與我聯繫</a></li>
            </ul>
        </div>
    </div>
    
    <script>
        // 記錄 404 錯誤到 Google Analytics（如果已設定）
        if (typeof gtag !== 'undefined') {
            gtag('event', 'exception', {
                'description': '404_error: ' + window.location.pathname,
                'fatal': false
            });
        }
        
        // 3秒後自動跳轉（可選）
        // setTimeout(() => {
        //     window.location.href = '/';
        // }, 3000);
    </script>
</body>
</html>
